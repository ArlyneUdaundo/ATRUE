        <path d="M0 210 q20 -8 40 -2 l-4 6 q-18 4 -36 -0 Z" opacity="0.7"/>
        <path d="M0 260 q0 -24 0 -40 q14 10 18 26 q4 10 8 14 Z" opacity="0.9"/>
        <path d="M480 196 q-24 -14 -52 -8 q-18 4 -26 12 l0 2 q60 4 78 0 Z" opacity="0.8"/>
        <path d="M480 320 l0 -68 q-26 12 -44 34 q-8 12 -10 34 Z" opacity="0.92"/>
    </g>

    <g fill="#241840" opacity="0.9">
        <path d="M98 320 q4 -54 10 -84 q4 -20 2 -38 q-12 -12 -18 -30 q14 8 20 20 q2 -20 -2 -34 q10 12 12 32 q6 -14 18 -22 q-6 18 -14 30 q8 6 12 16 q-10 -2 -16 2 q-2 22 2 40 q6 30 10 80 Z"/>
        <path d="M150 320 q3 -36 6 -56 q2 -14 0 -26 q-8 -8 -12 -20 q10 6 14 14 q1 -14 -1 -24 q7 8 8 22 q4 -10 12 -16 q-4 12 -10 20 q6 4 8 11 q-7 -1 -11 1 q-1 15 1 27 q4 20 7 47 Z" opacity="0.85"/>
