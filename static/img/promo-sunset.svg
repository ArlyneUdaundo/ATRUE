<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunset over a tropical bay">
    <defs>
        <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#33245e"/>
            <stop offset="0.38" stop-color="#8a4a86"/>
            <stop offset="0.66" stop-color="#e0705f"/>
            <stop offset="0.86" stop-color="#f6a45c"/>
            <stop offset="1" stop-color="#ffd18a"/>
        </linearGradient>
        <linearGradient id="sunsetSea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c76a63"/>
            <stop offset="0.45" stop-color="#7d4a72"/>
            <stop offset="1" stop-color="#33245e"/>
        </linearGradient>
        <radialGradient id="sunOrb" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fff3c4"/>
            <stop offset="0.55" stop-color="#ffc873"/>
            <stop offset="1" stop-color="#ff9a5b" stop-opacity="0"/>
        </radialGradient>
        <filter id="sunsetBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>
    </defs>

    <rect width="480" height="320" fill="url(#sunsetSky)"/>
    <circle cx="330" cy="172" r="86" fill="url(#sunOrb)"/>
    <circle cx="330" cy="172" r="34" fill="#ffe6a6"/>

    <g fill="#ffffff" opacity="0.28" filter="url(#sunsetBlur)">
        <ellipse cx="140" cy="96" rx="110" ry="10"/>
        <ellipse cx="300" cy="122" rx="90" ry="8"/>
        <ellipse cx="90" cy="146" rx="70" ry="7"/>
        <ellipse cx="400" cy="84" rx="80" ry="9"/>
    </g>

    <path d="M0 196 L480 188 L480 320 L0 320 Z" fill="url(#sunsetSea)"/>
    <g stroke="#ffd9a3" stroke-linecap="round" opacity="0.55">
        <path d="M270 210 h120" stroke-width="3"/>
        <path d="M296 224 h84" stroke-width="2.5"/>
        <path d="M310 238 h52" stroke-width="2"/>
        <path d="M288 252 h96" stroke-width="1.6" opacity="0.6"/>
        <path d="M160 216 h56" stroke-width="2" opacity="0.35"/>
        <path d="M92 236 h44" stroke-width="1.6" opacity="0.3"/>
