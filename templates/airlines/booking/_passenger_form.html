<div class="pd-card pd-pax" data-pd-pax data-pd-index="__INDEX__">
    <div class="pd-pax__head">
        <h3 class="pd-pax__title"><i class="fas fa-user"></i> Passenger <span data-pd-pax-label>__LABEL__</span>
            <span class="pd-chip pd-chip--soft" data-pd-pax-cat>__CAT_LABEL__</span></h3>
        <button type="button" class="pd-pax__remove" data-pd-remove hidden aria-label="Remove this passenger"><i class="fas fa-trash-can"></i></button>
    </div>

    <div class="pd-grid">
        <label class="pd-field">
            <span class="pd-field__label">First name <span class="pd-req">*</span></span>
            <input type="text" name="pax___INDEX___first_name" data-pd-field="first_name" autocomplete="given-name" aria-required="true">
            <span class="pd-field__err" data-pd-err="first_name" role="alert"></span>
        </label>
        <label class="pd-field">
            <span class="pd-field__label">Middle name</span>
            <input type="text" name="pax___INDEX___middle_name" data-pd-field="middle_name" autocomplete="additional-name">
        </label>
        <label class="pd-field">
            <span class="pd-field__label">Last name <span class="pd-req">*</span></span>
            <input type="text" name="pax___INDEX___last_name" data-pd-field="last_name" autocomplete="family-name" aria-required="true">
            <span class="pd-field__err" data-pd-err="last_name" role="alert"></span>
        </label>
        <input type="hidden" name="pax___INDEX___full_name" data-pd-field="full_name">

        <label class="pd-field">
            <span class="pd-field__label">Passenger classification <span class="pd-req">*</span></span>
            <select data-pd-field="classification" data-pd-classification aria-required="true">
                <option value="">Select classification</option>
                <option value="adult">Adult</option>
                <option value="child">Child</option>
                <option value="infant">Infant</option>
                <option value="senior">Senior Citizen</option>
                <option value="pwd">Person with Disability (PWD)</option>
            </select>
            <span class="pd-field__hint" data-pd-classification-hint>Select a date of birth to get a suggested classification.</span>
            <span class="pd-field__err" data-pd-err="classification" role="alert"></span>
        </label>

        <label class="pd-field pd-field--span-2">
            <span class="pd-field__label">Email address <span class="pd-req">*</span></span>
            <input type="email" name="pax___INDEX___email" data-pd-field="email" autocomplete="email"
                   placeholder="name@example.com" aria-required="true">
            <span class="pd-field__err" data-pd-err="email" role="alert"></span>
        </label>

        <label class="pd-field pd-field--wide">
            <span class="pd-field__label">Phone number <span class="pd-req">*</span></span>
            <span class="pd-phone">
                <select data-pd-field="phone_code" aria-label="Country code">
                    <option value="+63">PH +63</option>
                    <option value="+65">SG +65</option>
                    <option value="+60">MY +60</option>
                    <option value="+62">ID +62</option>
                    <option value="+66">TH +66</option>
                    <option value="+84">VN +84</option>
                    <option value="+852">HK +852</option>
                    <option value="+971">AE +971</option>
                    <option value="+1">US +1</option>
                    <option value="+44">GB +44</option>
                    <option value="+81">JP +81</option>
                    <option value="+82">KR +82</option>
                    <option value="+61">AU +61</option>
                </select>
                <input type="tel" data-pd-field="phone" autocomplete="tel" placeholder="9123456789" maxlength="11" pattern="[0-9]{11}" aria-required="true">
            </span>
            <span class="pd-field__err" data-pd-err="phone" role="alert"></span>
        </label>

        <label class="pd-field">
            <span class="pd-field__label">Date of birth <span class="pd-req">*</span></span>
            <input type="date" data-pd-field="dob" aria-required="true">
            <span class="pd-field__err" data-pd-err="dob" role="alert"></span>
        </label>
        <label class="pd-field pd-field--span-2" data-pd-infant-options hidden>
            <span class="pd-field__label">Infant travel option <span class="pd-req">*</span></span>
            <select data-pd-field="infant_travel_option" data-pd-infant-option>
                <option value="lap">Infant on lap</option>
                <option value="seat">Infant with own seat</option>
            </select>
            <span class="pd-field__hint">Lap infants share an eligible adult's place; an infant with a seat must have a separate assigned seat.</span>
            <span class="pd-field__err" data-pd-err="infant_travel_option" role="alert"></span>
        </label>

        <label class="pd-field">
            <span class="pd-field__label">Gender <span class="pd-req">*</span></span>
            <select data-pd-field="gender" aria-required="true">
                <option value="">Select gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
                <option value="undisclosed">Prefer not to say</option>
            </select>
            <span class="pd-field__err" data-pd-err="gender" role="alert"></span>
        </label>

        <label class="pd-field">
            <span class="pd-field__label">Nationality <span class="pd-req">*</span></span>
            <select data-pd-field="nationality" aria-required="true">
                <option value="">Select nationality</option>
                <option value="Philippines" selected>Philippines</option>
                <option value="Singapore">Singapore</option>
                <option value="Malaysia">Malaysia</option>
                <option value="Indonesia">Indonesia</option>
                <option value="Thailand">Thailand</option>
                <option value="Vietnam">Vietnam</option>
                <option value="Hong Kong">Hong Kong</option>
                <option value="United Arab Emirates">United Arab Emirates</option>
                <option value="United States">United States</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Japan">Japan</option>
                <option value="South Korea">South Korea</option>
                <option value="Australia">Australia</option>
                <option value="Other">Other</option>
            </select>
            <span class="pd-field__err" data-pd-err="nationality" role="alert"></span>
        </label>

        <label class="pd-field pd-field--wide" data-pd-passport{% if default_flight_type != 'INTERNATIONAL' %} hidden{% endif %}>
            <span class="pd-field__label">Passport number <span class="pd-req" data-pd-passport-req{% if default_flight_type != 'INTERNATIONAL' %} hidden{% endif %}>*</span></span>
            <input type="text" data-pd-field="passport" autocomplete="off"
                   placeholder="e.g. P1234567A" aria-required="{% if default_flight_type == 'INTERNATIONAL' %}true{% else %}false{% endif %}">
            <span class="pd-field__hint" data-pd-passport-hint>Required for international flights.</span>
            <span class="pd-field__err" data-pd-err="passport" role="alert"></span>
        </label>
        <label class="pd-field" data-pd-passport-country{% if default_flight_type != 'INTERNATIONAL' %} hidden{% endif %}>
            <span class="pd-field__label">Passport issuing country <span class="pd-req">*</span></span>
            <input type="text" data-pd-field="passport_country" autocomplete="country-name" aria-required="{% if default_flight_type == 'INTERNATIONAL' %}true{% else %}false{% endif %}">
            <span class="pd-field__err" data-pd-err="passport_country" role="alert"></span>
        </label>
        <label class="pd-field" data-pd-passport-expiry{% if default_flight_type != 'INTERNATIONAL' %} hidden{% endif %}>
            <span class="pd-field__label">Passport expiry date <span class="pd-req">*</span></span>
            <input type="date" data-pd-field="passport_expiry" aria-required="{% if default_flight_type == 'INTERNATIONAL' %}true{% else %}false{% endif %}">
            <span class="pd-field__err" data-pd-err="passport_expiry" role="alert"></span>
        </label>
        <label class="pd-field pd-field--wide">
            <span class="pd-field__label">Extra baggage (optional)</span>
            <select class="pd-baggage-select" data-pd-field="baggage_kg">
                {% for opt in fare.baggage_options %}
                <option value="{{ opt.kg }}"{% if not opt.kg %} selected{% endif %}>
                    {{ opt.label }}{% if opt.kg %} — {{ opt.price_text }}{% endif %}
                </option>
                {% endfor %}
            </select>
            <span class="pd-field__hint">Only this passenger will be charged for the selected baggage.</span>
        </label>
    </div>

    <div class="pd-pax__seat" data-pd-pax-seat>
        <i class="fas fa-couch"></i>
        <span>Seat: <b data-pd-pax-seat-value>Not selected</b></span>
    </div>
</div>
