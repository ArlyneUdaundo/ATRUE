<div class="pd-card pd-section pd-seat-section" id="pd-seat-section">
    <div class="pd-section__head">
        <h2><i class="fas fa-couch"></i> Seat Selection</h2>
        <p>Seat selection is optional. Children occupy a seat; infants do not.</p>
    </div>

    <div class="pd-seat-summary" data-pd-seat-summary>
        <p class="pd-muted" data-pd-seat-summary-empty>No seats selected yet.</p>
        <ul class="pd-seat-summary__list" data-pd-seat-summary-list hidden></ul>
        <div class="pd-seat-selected-details" data-pd-seat-selected-details style="margin-top: 10px;"></div>
    </div>

    <button type="button" class="pd-btn pd-btn--primary pd-btn--wide" data-pd-open-seat>
        <i class="fas fa-couch"></i> Select Seat
    </button>
    <p class="pd-field__hint" data-pd-seat-hint></p>
</div>
