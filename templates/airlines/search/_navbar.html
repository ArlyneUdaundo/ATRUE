{% load static %}{# Top navigation: brand, primary links with Flights active, and account tools. #}
<header class="fs-nav">
    <div class="fs-nav__inner">
        <a href="{% url 'home' %}" class="fs-brand">
            <span class="fs-brand__mark"><img src="{% static 'img/atrue-logo-mark.png' %}?v=20261022-flight-brand-1" alt="ATRUE Travel &amp; Tours"></span>
            <span class="fs-brand__name">
                <span class="fs-brand__text">
                    <b>ATRUE</b>
                    <small>Travel &amp;<br>Tours</small>
                </span>
            </span>
        </a>

        <nav class="fs-nav__links" id="fsNavLinks" aria-label="Primary">
            <a href="{% url 'home' %}" class="fs-nav__link"><i class="fas fa-house" aria-hidden="true"></i>Home</a>
            <a href="{% url 'hotels:list' %}" class="fs-nav__link"><i class="fas fa-hotel" aria-hidden="true"></i>Hotels</a>
            <a href="{% url 'airlines:list' %}" class="fs-nav__link is-active" aria-current="page"><i class="fas fa-plane" aria-hidden="true"></i>Flights</a>
            <a href="{% url 'tour_package:list' %}" class="fs-nav__link"><i class="fas fa-suitcase-rolling" aria-hidden="true"></i>Tours</a>
            <a href="{% url 'transportation:list' %}" class="fs-nav__link"><i class="fas fa-car-side" aria-hidden="true"></i>Car Rental</a>
            <a href="{% url 'restaurants:list' %}" class="fs-nav__link"><i class="fas fa-utensils" aria-hidden="true"></i>Restaurants</a>
        </nav>

        <div class="fs-nav__actions">
            {% if can_add_flight %}
            <a href="{% url 'airlines:add_flight_schedule' %}" class="fs-nav__add"><i class="fas fa-plus" aria-hidden="true"></i> Add Flight</a>
            {% endif %}
            <button type="button" class="fs-iconbtn" data-fs-focus-search aria-label="Search flights" title="Search"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></button>
            <div class="fs-pop" data-fs-pop="notifications">
                <button type="button" class="fs-iconbtn" data-fs-pop-toggle aria-haspopup="true" aria-expanded="false" aria-label="Notifications" title="Notifications">
                    <i class="fas fa-bell" aria-hidden="true"></i><span class="fs-iconbtn__dot" aria-hidden="true"></span>
                </button>
                <div class="fs-pop__panel" data-fs-pop-panel hidden>
                    <p class="fs-pop__title">Notifications</p>
                    <p class="fs-pop__empty"><i class="fas fa-check-circle" aria-hidden="true"></i> You're all caught up.</p>
                </div>
            </div>
            <div class="fs-pop fs-user" data-fs-pop="user">
                <button type="button" class="fs-user__btn" data-fs-pop-toggle aria-haspopup="true" aria-expanded="false">
                    <span class="fs-avatar" aria-hidden="true">E</span>
                    <span class="fs-user__name">Eula D. Espiritu</span>
                    <i class="fas fa-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="fs-pop__panel fs-pop__panel--right" data-fs-pop-panel hidden>
                    <a href="{% url 'dashboard' %}"><i class="fas fa-gauge-high" aria-hidden="true"></i> Dashboard</a>
                    <a href="{% url 'transactions:booking_list' %}"><i class="fas fa-ticket" aria-hidden="true"></i> My Bookings</a>
                    <a href="{% url 'accounts:my_account' %}"><i class="fas fa-user-circle" aria-hidden="true"></i> My Account</a>
                    <a href="{% url 'accounts:logout' %}"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Sign out</a>
                </div>
            </div>
            <button type="button" class="fs-iconbtn fs-nav__burger" data-fs-nav-toggle aria-controls="fsNavLinks" aria-expanded="false" aria-label="Menu"><i class="fas fa-bars" aria-hidden="true"></i></button>
        </div>
    </div>
</header>
