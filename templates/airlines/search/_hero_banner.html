{% load static %}
{# Hero banner: aerial wing view over clouds with a readable blue overlay. #}
<section class="fs-hero" aria-labelledby="fsHeroTitle">
    <div class="fs-hero__media" aria-hidden="true">
        <img src="{% static 'img/flights-hero.svg' %}" alt="">
    </div>
    <div class="fs-hero__inner">
        <div class="fs-hero__copy">
            <p class="fs-hero__eyebrow">FLIGHTS</p>
            <h1 class="fs-hero__title" id="fsHeroTitle">Discover the World</h1>
            <p class="fs-hero__sub">Book your next flight with ease and explore new destinations.</p>
        </div>
        <p class="fs-hero__slogan"><i class="fas fa-feather-pointed" aria-hidden="true"></i> Same skies, new stories</p>
    </div>
</section>
