<form method="post" action="{% url 'simulation:add_announcement' %}{% if modal_request %}?modal=1{% endif %}" {% if modal_request %}data-announcement-modal-form{% else %}data-submit-loading{% endif %}>
    {% csrf_token %}
    {% if modal_request %}<input type="hidden" name="modal" value="1">{% endif %}
    {% if errors %}
    <div class="alert alert-error" role="alert">
        {% for error in errors %}<div>{{ error }}</div>{% endfor %}
    </div>
    {% endif %}
    <div class="form-group">
        <label for="announcementSession">Session</label>
        <select name="session" id="announcementSession" class="form-input" required>
            <option value="" disabled {% if not posted.session %}selected{% endif %}>Select a session</option>
            {% for session in sessions %}
            <option value="{{ session.pk }}" {% if posted.session == session.pk|stringformat:"s" %}selected{% endif %}>{{ session.name }}{% if session.session_id %} ({{ session.session_id }}){% endif %}</option>
            {% empty %}
            <option value="" disabled>No sessions available</option>
            {% endfor %}
        </select>
        <span class="muted-hint">Only students assigned to this session will receive the notification.</span>
    </div>
    <div class="form-group">
        <label for="announcementKind">Type</label>
        <select name="kind" id="announcementKind" class="form-input">
            {% for value, label in kind_choices %}
            <option value="{{ value }}" {% if posted.kind == value or not posted and value == 'ANNOUNCEMENT' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="announcementTitle">Title</label>
        <input type="text" name="title" id="announcementTitle" class="form-input" maxlength="150" value="{{ posted.title|default:'' }}" placeholder="e.g. Schedule change for tomorrow" required>
    </div>
    <div class="form-group">
        <label for="announcementMessage">Message</label>
        <textarea name="message" id="announcementMessage" class="form-input" rows="6" placeholder="Write the announcement students should see in their notifications." required>{{ posted.message|default:'' }}</textarea>
    </div>
    <div class="simulation-session-form-actions">
        <button type="submit" class="btn btn-brand"><i class="fas fa-bullhorn"></i> Send Announcement</button>
        {% if modal_request %}
        <button type="button" class="btn btn-outline" data-announcement-modal-close>Cancel</button>
        {% else %}
        <a href="{% url 'simulation:workspace' %}" class="btn btn-outline">Cancel</a>
        {% endif %}
    </div>
</form>
