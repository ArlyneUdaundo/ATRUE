{% load static %}
<div class="hbd-gallery" data-hbd-gallery aria-label="{{ reservation_property.name }} property photos">
    {% for photo in reservation_property.photos.all %}
    <img src="{{ photo.image.url }}" alt="{{ photo.caption|default:reservation_property.name }}" class="hbd-gallery-image{% if forloop.first %} is-active{% endif %}" data-hbd-image loading="lazy">
    {% empty %}
    <img src="{% static 'img/hotel-placeholder.svg' %}" alt="{{ reservation_property.name }}" class="hbd-gallery-image is-active" data-hbd-image>
    {% endfor %}
    <div class="hbd-gallery-label"><i class="fas fa-camera"></i> Property Photos</div>
    {% if reservation_property.photos.all|length > 1 %}
    <div class="hbd-gallery-count"><span data-hbd-current>1</span> / {{ reservation_property.photos.all|length }}</div>
    <button type="button" class="hbd-gallery-arrow hbd-gallery-prev" data-hbd-step="-1" aria-label="Previous property photo"><i class="fas fa-chevron-left"></i></button>
    <button type="button" class="hbd-gallery-arrow hbd-gallery-next" data-hbd-step="1" aria-label="Next property photo"><i class="fas fa-chevron-right"></i></button>
    {% endif %}
</div>
