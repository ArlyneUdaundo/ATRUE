{% extends 'dashboard_base.html' %}

{% block title %}{% if agency %}Update Agency{% else %}Add Agency{% endif %}{% endblock %}

{% block content %}
<div class="page-head"><div><h1>{% if agency %}Update Agency{% else %}Add New Agency{% endif %}</h1><p>Transport agency establishment information.</p></div></div>

<form method="post" class="card card-pad" style="max-width:720px" data-submit-loading>
    {% csrf_token %}
    <div class="form-group">
        <label>Agency Name</label>
        <input type="text" name="name" class="form-input" value="{{ agency.name|default:'' }}" required>
    </div>
    <div class="form-group">
        <label>Street Address</label>
        <input type="text" name="address" class="form-input" value="{{ agency.address|default:'' }}" placeholder="Street / house number (optional)">
    </div>
    <div class="form-grid">
        <div class="form-group"><label>Barangay</label><input type="text" name="barangay" class="form-input" value="{{ agency.barangay|default:'' }}" placeholder="Barangay"></div>
        <div class="form-group"><label>Municipality/City</label><input type="text" name="municipality" class="form-input" value="{{ agency.municipality|default:'' }}" placeholder="Municipality/City"></div>
        <div class="form-group"><label>Province</label><input type="text" name="province" class="form-input" value="{{ agency.province|default:'' }}" placeholder="Province"></div>
    </div>
    <div class="form-grid">
        <div class="form-group"><label>Contact Number</label><input type="text" name="contact_number" class="form-input" value="{{ agency.contact_number|default:'' }}"></div>
        <div class="form-group"><label>Email Address</label><input type="email" name="email" class="form-input" value="{{ agency.email|default:'' }}"></div>
    </div>
    <div class="form-group">
        <label>Operating Hours</label>
        <input type="text" name="operating_hours" class="form-input" value="{{ agency.operating_hours|default:'' }}" placeholder="6 AM - 10 PM daily">
    </div>
    <div class="form-group">
        <label>Status</label>
        <select name="status" class="form-input">
            <option value="ACTIVE" {% if agency.status == 'ACTIVE' %}selected{% endif %}>Active</option>
            <option value="INACTIVE" {% if agency.status == 'INACTIVE' %}selected{% endif %}>Inactive</option>
            <option value="SUSPENDED" {% if agency.status == 'SUSPENDED' %}selected{% endif %}>Suspended</option>
            <option value="UNDER_MAINTENANCE" {% if agency.status == 'UNDER_MAINTENANCE' %}selected{% endif %}>Under Maintenance</option>
        </select>
    </div>
    <button type="submit" class="btn btn-brand" style="width:100%;padding:14px">Save Agency</button>
    <a href="{% url 'transportation:manage' %}" class="btn btn-outline" style="width:100%;margin-top:10px">Cancel</a>
</form>
{% endblock %}
