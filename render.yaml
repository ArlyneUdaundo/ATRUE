services:
  - type: web
    name: atrue-performance-staging
    runtime: python
    region: singapore
    plan: free
    branch: render-staging
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atrue-performance-staging-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: ATRUE Simulation Portal
      - key: APP_BASE_URL
        value: https://atrue-performance-staging.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: establishment-images
      - key: SUPABASE_PRIVATE_BUCKET
        value: profile-images

databases:
  - name: atrue-performance-staging-db
    region: singapore
    databaseName: atrue_perf_staging
    user: atrue_perf_staging
    plan: 0.1c-256mb
