services:
  - type: web
    name: atrue-performance-staging
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    branch: render-staging
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /
    autoDeployTrigger: commit
    disk:
      name: atrue-staging-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atrue-performance-staging-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

databases:
  - name: atrue-performance-staging-db
    region: singapore
    databaseName: atrue_perf_staging
    user: atrue_perf_staging
    plan: 0.1c-256mb
