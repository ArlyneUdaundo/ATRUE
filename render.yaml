services:
  - type: web
    name: atrue-performance-staging
    runtime: python
    region: singapore
    plan: free
    branch: render-staging
    buildCommand: bash build.sh
    startCommand: python -m gunicorn atrue_core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atrue-performance-staging-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

databases:
  - name: atrue-performance-staging-db
    region: singapore
    databaseName: atrue_perf_staging
    user: atrue_perf_staging
    plan: free